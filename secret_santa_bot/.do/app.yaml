# Mirror of the live App Platform app "coral-app" (lon).
# Pushes to main deploy from the spec stored in DigitalOcean, not from this file.
# Do not apply this file with doctl: DISCORD_TOKEN is already set on the app,
# and this copy intentionally has no token value.
name: coral-app
region: lon
services:
- name: discord-bot-secret-santa-bot
  github:
    repo: padmick/discord_bot
    branch: main
    deploy_on_push: true
  dockerfile_path: secret_santa_bot/Dockerfile
  source_dir: secret_santa_bot
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  envs:
  - key: DISCORD_TOKEN
    scope: RUN_TIME
    type: SECRET
  - key: SETUP_DATABASE
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db-secret-santa.DATABASE_URL}
  - key: CLOUDFLARE_ACCOUNT_ID
    scope: RUN_TIME
    value: "ed6ea78b0237fb504eaa26c30768dd4f"
  - key: CLOUDFLARE_API_TOKEN
    scope: RUN_TIME
    type: SECRET
  - key: EASTER_EGG_MODEL
    scope: RUN_TIME
    value: "@cf/ibm-granite/granite-4.0-h-micro"
ingress:
  rules:
  - component:
      name: discord-bot-secret-santa-bot
    match:
      path:
        prefix: /
databases:
- name: db-secret-santa
  engine: PG
  version: "17"
